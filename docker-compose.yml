services:
  db:
    image: mysql:8.0
    container_name: taylor_db
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: taylor_php
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=taylor"
      XDEBUG_MODE: off

  webserver:
    image: nginx:alpine
    container_name: taylor_nginx
    depends_on:
      php:
        condition: service_started
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"] 
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
